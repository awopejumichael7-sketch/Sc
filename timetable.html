<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable & Events — Scholar's Camp LMS</title>
<meta name="theme-color" content="#0B1E3F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand">
      <span class="seal"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" stroke="#C9A227" stroke-width="2.5" fill="none"/><circle cx="24" cy="24" r="14" fill="#1E3A8A"/><text x="24" y="29" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="13" fill="#E8C766">SC</text></svg></span>
      Scholar's Camp
    </a>
    <span class="side-label">Schedule</span>
    <a class="side-link active" data-section="timetable"><i class="fa-solid fa-table-cells"></i> Weekly Timetable</a>
    <a class="side-link" data-section="events"><i class="fa-solid fa-calendar-star"></i> Events</a>
    <span class="side-label">Back</span>
    <a class="side-link" id="backLink"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="icon-btn sidebar-toggle" data-nav-toggle="#sidebar" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div style="font-weight:700;">Schedule</div>
      </div>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"><i class="fa-solid fa-moon" data-theme-icon></i></button>
    </div>

    <div class="content">

      <!-- TIMETABLE -->
      <section class="dash-section" id="sec-timetable">
        <div class="flex justify-between items-center mb-16" style="flex-wrap:wrap;gap:12px;">
          <div><h1 class="page-title" style="margin-bottom:2px;">Weekly Timetable</h1><p class="page-sub" style="margin-bottom:0;">Course sessions across the week.</p></div>
          <button class="btn btn-gold btn-sm hidden" id="addSlotBtn"><i class="fa-solid fa-plus"></i> Add Slot</button>
        </div>
        <div class="card"><div class="table-wrap">
          <table class="data" id="timetableTable">
            <thead><tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr></thead>
            <tbody></tbody>
          </table>
        </div></div>
      </section>

      <!-- EVENTS -->
      <section class="dash-section hidden" id="sec-events">
        <div class="flex justify-between items-center mb-16" style="flex-wrap:wrap;gap:12px;">
          <div><h1 class="page-title" style="margin-bottom:2px;">Events</h1><p class="page-sub" style="margin-bottom:0;">Exam windows, holidays, and campus-wide events.</p></div>
          <button class="btn btn-gold btn-sm hidden" id="addEventBtn"><i class="fa-solid fa-plus"></i> Add Event</button>
        </div>
        <div id="eventsList" class="grid grid-3"></div>
      </section>

    </div>
  </div>
</div>

<!-- MODAL: Timetable slot -->
<div class="modal-backdrop" id="modalSlot">
  <div class="modal">
    <div class="modal-head"><h3>Add Timetable Slot</h3><button class="modal-close" onclick="window.scUtils.closeModal('modalSlot')"><i class="fa-solid fa-xmark"></i></button></div>
    <form id="slotForm">
      <div class="field-row">
        <div class="field"><label>Day</label><select id="slotDay"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select></div>
        <div class="field"><label>Time</label><input type="text" id="slotTime" placeholder="e.g. 9:00–9:45am" required></div>
      </div>
      <div class="field"><label>Course</label><select id="slotCourse" required></select></div>
      <button class="btn btn-gold btn-block" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Slot</button>
    </form>
  </div>
</div>

<!-- MODAL: Event -->
<div class="modal-backdrop" id="modalEvent">
  <div class="modal">
    <div class="modal-head"><h3>Add Event</h3><button class="modal-close" onclick="window.scUtils.closeModal('modalEvent')"><i class="fa-solid fa-xmark"></i></button></div>
    <form id="eventForm">
      <div class="field"><label>Title</label><input type="text" id="eventTitle" required></div>
      <div class="field"><label>Date</label><input type="date" id="eventDate" required></div>
      <div class="field"><label>Description</label><textarea id="eventDesc" rows="3"></textarea></div>
      <button class="btn btn-gold btn-block" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Event</button>
    </form>
  </div>
</div>

<script type="module" src="timetable.js"></script>
</body>
</html>
